# ════════════════════════════════════════════════════════════════════
#  classes.yaml — 모델·클래스의 단일 기준
#  2026 HL FMA 1/5 Scale  /  The GIGACHA
#  최종 갱신 2026-09-12
# ════════════════════════════════════════════════════════════════════
#
#  ★ 이 파일이 유일한 기준입니다.
#    노드는 시동 시 모델의 names 와 여기를 대조하고, 다르면 죽습니다.
#    조용히 어긋난 채 도는 것보다 시동 때 죽는 편이 낫습니다.
#
#  ★ names 는 '학습에 쓴 data.yaml 의 names 를 그대로' 옮겨야 합니다.
#    순서가 곧 클래스 id 입니다. 이름만 맞고 순서가 다르면
#    에러 없이 전혀 다른 클래스로 해석됩니다.
#    (2025년 sign.pt / traffic_sign.pt 가 서로 바뀐 채 한 시즌을 돌았습니다)
#
#  ★ imgsz 는 학습 = TensorRT export = 런타임 세 군데가 같아야 합니다.
#    어긋나도 에러가 안 나고 작은 객체만 조용히 안 잡힙니다.
# ════════════════════════════════════════════════════════════════════


# ── 신호등 ──────────────────────────────────────────────────────────
#  2026-09-20 역광 대응 파인튜닝본으로 교체.
#    · 09-12 시점에는 파인튜닝이 원본보다 나빠서 2025년 모델(traffic_light_20250918.pt)을
#      그대로 썼다. 그때는 증강이 색상까지 흔들어 신호등 색을 망가뜨리고 있었다.
#    · v2 는 그 모델에서 30 epoch 이어 학습했고, 증강을 색상 고정·밝기 위주로 바꿨다
#      (hsv_h 0.05→0.0, hsv_s 0.7→0.2, hsv_v 0.7→0.5, mosaic 1.0→0.3).
#  클래스 5개와 순서, imgsz 640 은 09-18 모델과 같다. 비교는 tools/tl_view.py.
traffic_light:
  file: "weights/traffic_light_ft640_v2_20260920.pt"
  imgsz: 640
  names: {0: green_left, 1: green, 2: left, 3: red, 4: yellow}

  # left = 적색 + 좌회전 화살표 동시 점등 (직진 금지, 좌회전만 허용)
  #   2026-09-11 확인:
  #     · driving.mp4(용인) 에서 해당 신호를 모델이 left 로 분류
  #     · Roboflow Universe 2개 데이터셋의 left 샘플도 같은 의미
  #   운전면허시험장 신호등이 노후해 적색과 좌회전이 동시에 켜지는
  #   구간이 있고, 그 코스에서 좌회전해야 함.
  #
  # green_left = 녹색 + 좌회전 동시신호.
  #   시험장에서 관측되지 않았고 학습 데이터도 없음.
  #   클래스는 유지하되 판단에 쓰지 않음.

  go_straight: [green]
  go_left:     [left]
  stop:        [red, yellow]

  # ★ red 와 left 의 차이는 작은 화살표 램프 하나입니다.
  #   30 m 에서 신호등 전체가 40 px 이면 화살표는 8 px 입니다.
  #   오분류의 대가가 비대칭이라 판정 규칙도 비대칭이어야 합니다:
  #     left -> red  로 오인 : 좌회전 구간에서 영원히 정지
  #     red  -> left 로 오인 : 적신호 진입 (훨씬 나쁨)
  #   애매하면 red 쪽으로 기웁니다.


# ── 장애물 + 신호제어차량 ───────────────────────────────────────────
obstacle:
  file: "weights/obstacle.pt"
  imgsz: 960          # ★ 640 이면 LED 패널이 17 px 이라 못 잡습니다
  # ★ 이 순서는 학습에 쓴 data.yaml 의 순서(= Roboflow 의 ASCII 정렬)입니다.
  #   읽기 좋은 순서로 바꾸지 마십시오. obstacle_detector 는 모델이 뱉은
  #   인덱스를 여기 이름으로 변환하므로(self.names = sec["names"]),
  #   순서를 건드리면 좌우 지시가 정반대로 나갑니다.
  #   2026-09-12 에 실제로 어긋나 있었고 class_map 대조가 잡았습니다.
  names:
    0: T870          # S자 코스 장애물
    1: kid           # 돌발 장애물 (유아 인형)
    2: left_X        # 좌측 차로 폐쇄 (X)
    3: left_go       # 좌측 차로 개방 (↓)
    4: right_X       # 우측 차로 폐쇄 (X)
    5: right_go      # 우측 차로 개방 (↓)
    6: traffic_car   # 신호제어차량 차체

  # 두 패널은 상보적이라 실제 상태는 둘뿐입니다.
  #   left_go  + right_X  ->  좌측 차로로
  #   left_X   + right_go ->  우측 차로로
  # 하나만 봐도 지시가 결정되므로 이중화가 됩니다.
  # 판정 규칙은 utils/sign_car.py, 파라미터는 launch/obstacle.launch.
  #
  # ★ 좌우가 의미를 가지므로 학습·증강 어디서도 좌우 반전 금지.
  #   반전하면 left_go 가 right_go 그림이 되는데 라벨은 그대로라
  #   좌우를 정반대로 가르칩니다.

  panel_go: [left_go, right_go]
  panel_x:  [left_X, right_X]
  host:     traffic_car
  obstacles: [T870, kid]


# ── 차선 / 주행가능영역 ─────────────────────────────────────────────
lane:
  file: "weights/lane.pt"
  type: torchscript          # YOLOPv2
  input: [384, 640]          # letterbox 후 크기. 입력은 1280x720 로 리사이즈
  # ★ 실차 도로 영상으로 학습된 모델입니다.
  #   1/5 스케일은 카메라 높이가 0.67 m 라 소실점 위치가 다릅니다.
  #   2026-09-12 기준 아직 차량 장착 상태로 검증되지 않았습니다.
  #
  # 차선 세그멘테이션에는 클래스 인덱스가 없습니다(2채널 이진).
  # 차선·정지선·화살표·횡단보도가 전부 한 덩어리로 나옵니다.
  # 정지선만 기하로 분리하는 코드는 utils/stopline.py.


# ── 콘 (주차 보조) ──────────────────────────────────────────────────
cone:
  file: "weights/cone.pt"
  imgsz: 640
  names: {0: cone_blue, 1: cone_yellow}
  # ★ BRIO 좌·우 카메라가 입력입니다. 2026-09-06 에 USB 불안정으로
  #   2대 구성으로 줄이면서 입력이 사라졌습니다.
  #   perception.launch 의 cone 기본값이 false 인 이유입니다.
  #   BRIO 를 다시 달면 true 로 되돌리세요.


# ── 2026 에 쓰지 않음 ───────────────────────────────────────────────
# delivery_sign:
#   2025 저장소의 sign.pt. 확인 결과 다른 ERP 대회 미션용이라
#   2026 규정에 해당 미션이 없어 제외.
#   단 parkinglot 클래스가 있었으므로, 주차 미션이 표지판 인식을
#   요구한다면 obstacle 모델에 클래스로 흡수할 것.
